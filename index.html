<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liro Miyuki v1.4</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      updateProfile,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      query,
      where,
      orderBy,
      serverTimestamp,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ── Firebase Config ──────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyDl1C_xN_QxgSu49SKPBB1O3nke_7Ej-Lo",
      authDomain: "liro-miyuky.firebaseapp.com",
      projectId: "liro-miyuky",
      storageBucket: "liro-miyuky.firebasestorage.app",
      messagingSenderId: "774423148301",
      appId: "1:774423148301:web:17c5f11bec3e4f40d26244"
    };

    // ── Cloudinary Config ────────────────────────────────────────
    const CLOUDINARY_CLOUD = "dv7lelmoy";
    const CLOUDINARY_PRESET = "liro-miyuki";
    const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // ── State ────────────────────────────────────────────────────
    let currentUser = null;
    let currentView = "login";
    let gridCols = 10;
    let gridRows = 10;
    let gridData = [];
    let stitchType = "loom"; // loom | peyote
    let selectedColor = "#C9A96E";
    let isPainting = false;
    let paintMode = "paint"; // paint | erase
    let undoStack = [];
    const UNDO_LIMIT = 40;
    let currentRow = 0; // fila activa en modo "Tejer"
    let weavingMode = false;
    let userBeads = [];
    let userPatterns = [];
    let userProfile = { displayName: "", defaultCols: 10, defaultRows: 10 };
    let profileLoaded = false; // evita reaplicar tamaño por defecto sobre un patrón ya cargado

    // ── Init Grid ────────────────────────────────────────────────
    function initGrid() {
      gridData = Array.from({ length: gridRows }, () =>
        Array(gridCols).fill("#F0EBE3")
      );
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById("grid-container");
      if (!container) return;

      // Modo telar: cuadrícula recta con CSS grid (comportamiento original)
      // Modo peyote: filas en flex, con offset en filas impares (el desfase real del tejido)
      container.classList.toggle("mode-peyote", stitchType === "peyote");
      container.style.gridTemplateColumns = stitchType === "loom" ? `repeat(${gridCols}, 1fr)` : "";
      container.style.display = stitchType === "loom" ? "grid" : "flex";
      container.style.flexDirection = stitchType === "loom" ? "" : "column";
      container.innerHTML = "";

      const paintCell = (r, c, cellEl) => {
        const newColor = paintMode === "erase" ? "#F0EBE3" : selectedColor;
        gridData[r][c] = newColor;
        cellEl.style.backgroundColor = newColor;
      };

      const buildCell = (r, c, color) => {
        const cell = document.createElement("div");
        cell.className = "grid-cell";
        if (weavingMode && r === currentRow) cell.classList.add("row-active");
        cell.style.backgroundColor = color;
        cell.dataset.r = r;
        cell.dataset.c = c;

        cell.addEventListener("mousedown", () => { pushUndoSnapshot(); isPainting = true; paintCell(r, c, cell); });
        cell.addEventListener("mouseover", () => { if (isPainting) paintCell(r, c, cell); });
        cell.addEventListener("touchstart", (e) => { e.preventDefault(); pushUndoSnapshot(); isPainting = true; paintCell(r, c, cell); }, { passive: false });
        cell.addEventListener("touchmove", (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          if (el && el.classList.contains("grid-cell")) {
            const tr = +el.dataset.r, tc = +el.dataset.c;
            paintCell(tr, tc, el);
          }
        }, { passive: false });

        return cell;
      };

      if (stitchType === "loom") {
        gridData.forEach((row, r) => {
          row.forEach((color, c) => {
            container.appendChild(buildCell(r, c, color));
          });
        });
      } else {
        // Peyote/brick: cada fila es un contenedor flex; filas impares llevan
        // un margen de medio-celda para simular el desfase del tejido real
        gridData.forEach((row, r) => {
          const rowEl = document.createElement("div");
          rowEl.className = "peyote-row";
          if (r % 2 === 1) rowEl.classList.add("offset");
          row.forEach((color, c) => {
            rowEl.appendChild(buildCell(r, c, color));
          });
          container.appendChild(rowEl);
        });
      }

      document.addEventListener("mouseup", () => { isPainting = false; });
    }

    // ── Render Palette ───────────────────────────────────────────
    function renderPalette() {
      const palette = document.getElementById("bead-palette");
      if (!palette) return;
      palette.innerHTML = "";

      const defaults = ["#C9A96E","#8B6B8B","#1A1A2E","#E8D5C4","#F0EBE3",
                        "#D4A5A5","#7EC8C8","#A8D8A8","#F4C97E","#4A4A6A"];

      const allColors = [...new Set([...defaults, ...userBeads.map(b => b.hex)])];

      allColors.forEach(hex => {
        const swatch = document.createElement("button");
        swatch.className = "swatch";
        swatch.style.backgroundColor = hex;
        if (hex === selectedColor) swatch.classList.add("active");
        swatch.title = hex;
        swatch.addEventListener("click", () => {
          selectedColor = hex;
          paintMode = "paint";
          document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
          swatch.classList.add("active");
          document.getElementById("btn-erase").classList.remove("active");
        });
        palette.appendChild(swatch);
      });
    }

    // ── Capture Grid as Image ────────────────────────────────────
    function captureGridImage() {
      return new Promise((resolve) => {
        const cellSize = 20;
        const canvas = document.createElement("canvas");
        canvas.width = gridCols * cellSize;
        canvas.height = gridRows * cellSize;
        const ctx = canvas.getContext("2d");
        gridData.forEach((row, r) => {
          row.forEach((color, c) => {
            ctx.fillStyle = color;
            ctx.fillRect(c * cellSize, r * cellSize, cellSize - 1, cellSize - 1);
          });
        });
        canvas.toBlob(resolve, "image/png");
      });
    }

    // ── Undo ─────────────────────────────────────────────────────
    function pushUndoSnapshot() {
      undoStack.push(JSON.stringify(gridData));
      if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    }

    function undo() {
      if (undoStack.length === 0) { showToast("Nada que deshacer"); return; }
      gridData = JSON.parse(undoStack.pop());
      renderGrid();
      showToast("↩️ Deshecho");
    }

    // ── Paneles exclusivos (Materiales / Por fila / Tejer) ────────
    // Solo uno puede estar abierto a la vez, para que la columna de
    // controles en escritorio no crezca sin control ("chorizo" vertical).
    function closeOtherPanels(except) {
      const panels = { materials: "materials-panel", rowcounts: "row-counts-panel", weaving: "weaving-panel" };
      Object.entries(panels).forEach(([key, id]) => {
        if (key !== except) document.getElementById(id).classList.remove("show");
      });
      if (except !== "weaving" && weavingMode) {
        weavingMode = false;
        document.getElementById("btn-weave").classList.remove("active");
      }
    }

    // ── Modo Tejer (contador de filas) ──────────────────────────
    function toggleWeavingMode() {
      const turningOn = !weavingMode;
      if (turningOn) closeOtherPanels("weaving");
      weavingMode = turningOn;
      currentRow = 0;
      const panel = document.getElementById("weaving-panel");
      panel.classList.toggle("show", weavingMode);
      document.getElementById("btn-weave").classList.toggle("active", weavingMode);
      if (weavingMode) updateWeavingPanel();
      renderGrid();
    }

    function updateWeavingPanel() {
      document.getElementById("weaving-row-label").textContent = `Fila ${currentRow + 1} de ${gridRows}`;
      document.querySelectorAll(".grid-cell-row-marker").forEach(el => el.remove());
      renderGrid();
    }

    function stepRow(delta) {
      currentRow = Math.max(0, Math.min(gridRows - 1, currentRow + delta));
      updateWeavingPanel();
    }

    // ── Conteo por fila ──────────────────────────────────────────
    function toggleRowCounts() {
      const panel = document.getElementById("row-counts-panel");
      const isShowing = panel.classList.contains("show");
      if (isShowing) {
        panel.classList.remove("show");
        return;
      }
      closeOtherPanels("rowcounts");
      const findLabel = (hex) => {
        const match = userBeads.find(b => b.hex.toLowerCase() === hex.toLowerCase());
        return match ? (match.code || match.name) : hex;
      };
      panel.innerHTML = gridData.map((row, i) => {
        const counts = {};
        row.forEach(hex => {
          if (hex === "#F0EBE3") return;
          counts[hex] = (counts[hex] || 0) + 1;
        });
        const entries = Object.entries(counts);
        if (entries.length === 0) return "";
        const parts = entries.map(([hex, n]) => `
          <span class="row-count-chip">
            <span class="chip-dot" style="background:${hex}"></span>${findLabel(hex)} ×${n}
          </span>
        `).join("");
        return `<div class="row-count-line"><strong>Fila ${i + 1}:</strong> ${parts}</div>`;
      }).join("") || `<p class="empty-msg">Pinta algo primero 🎨</p>`;
      panel.classList.add("show");
    }


    // Estimado: cuenta Miyuki 11/0 ≈ 20 cuentas por gramo (aproximado,
    // varía según lote/forma). Se usa solo como referencia.
    const BEADS_PER_GRAM = 20;

    function calculateMaterials() {
      const counts = {};
      gridData.forEach(row => {
        row.forEach(color => {
          if (color === "#F0EBE3") return; // celda vacía, no cuenta
          counts[color] = (counts[color] || 0) + 1;
        });
      });

      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const totalBeads = entries.reduce((sum, [, n]) => sum + n, 0);
      const totalGrams = (totalBeads / BEADS_PER_GRAM).toFixed(1);

      const panel = document.getElementById("materials-panel");
      if (entries.length === 0) {
        panel.innerHTML = `<p class="empty-msg">Pinta algo en la cuadrícula primero 🎨</p>`;
        panel.classList.add("show");
        return;
      }

      const findBeadLabel = (hex) => {
        const match = userBeads.find(b => b.hex.toLowerCase() === hex.toLowerCase());
        return match ? `${match.code ? match.code + " · " : ""}${match.name}` : null;
      };

      panel.innerHTML = `
        <div class="materials-summary">
          <strong>${totalBeads}</strong> cuentas · <strong>~${totalGrams} g</strong> aprox.
        </div>
        <div class="materials-list">
          ${entries.map(([hex, count]) => {
            const label = findBeadLabel(hex);
            const grams = (count / BEADS_PER_GRAM).toFixed(1);
            return `
              <div class="material-item">
                <div class="bead-color" style="background:${hex}"></div>
                <div class="bead-info">
                  <span class="bead-name">${label || hex}</span>
                  <span class="bead-code">${count} cuentas · ~${grams} g</span>
                </div>
              </div>
            `;
          }).join("")}
        </div>
        <p class="materials-note">* Estimado con ${BEADS_PER_GRAM} cuentas/gramo (Miyuki 11/0). Puede variar según el lote.</p>
      `;
      panel.classList.add("show");
    }


    // ── Exportar / Imprimir ──────────────────────────────────────
    async function exportPattern() {
      const name = document.getElementById("pattern-name").value.trim() || "Patrón sin nombre";
      const blob = await captureGridImage();
      const imgUrl = URL.createObjectURL(blob);

      const counts = {};
      gridData.forEach(row => row.forEach(hex => {
        if (hex === "#F0EBE3") return;
        counts[hex] = (counts[hex] || 0) + 1;
      }));
      const findLabel = (hex) => {
        const match = userBeads.find(b => b.hex.toLowerCase() === hex.toLowerCase());
        return match ? `${match.code ? match.code + " — " : ""}${match.name}` : hex;
      };
      const legendRows = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .map(([hex, n]) => `
          <tr>
            <td><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${hex};border:1px solid #ccc;vertical-align:middle;"></span></td>
            <td>${findLabel(hex)}</td>
            <td>${n} cuentas</td>
          </tr>
        `).join("");

      const printWindow = window.open("", "_blank");
      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
          <meta charset="UTF-8" />
          <title>${name} — Liro Miyuki</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 2rem; color: #1A1A2E; }
            h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
            .meta { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; }
            img { max-width: 100%; image-rendering: pixelated; border: 1px solid #ddd; margin-bottom: 1.5rem; }
            table { border-collapse: collapse; width: 100%; max-width: 400px; }
            td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; font-size: 0.85rem; }
            @media print { body { padding: 0.5rem; } }
          </style>
        </head>
        <body>
          <h1>${name}</h1>
          <p class="meta">${gridCols} × ${gridRows} · ${stitchType === "peyote" ? "Peyote / Brick stitch" : "Telar"}</p>
          <img src="${imgUrl}" alt="${name}" />
          <table>${legendRows}</table>
          <script>window.onload = () => setTimeout(() => window.print(), 300);<\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    async function uploadToCloudinary(blob) {
      const formData = new FormData();
      formData.append("file", blob);
      formData.append("upload_preset", CLOUDINARY_PRESET);
      const res = await fetch(CLOUDINARY_UPLOAD_URL, { method: "POST", body: formData });
      const data = await res.json();
      return data.secure_url;
    }

    // ── Save Pattern ─────────────────────────────────────────────
    async function savePattern() {
      const name = document.getElementById("pattern-name").value.trim();
      const tagsRaw = document.getElementById("pattern-tags").value.trim();
      const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim().toLowerCase()).filter(Boolean) : [];
      if (!name) { showToast("Ponle un nombre al patrón ✏️"); return; }
      if (!currentUser) return;

      showToast("Guardando patrón...");
      try {
        const blob = await captureGridImage();
        const imageUrl = await uploadToCloudinary(blob);
        await addDoc(collection(db, "patrones"), {
          uid: currentUser.uid,
          name,
          tags,
          imageUrl,
          gridData: JSON.stringify(gridData),
          cols: gridCols,
          rows: gridRows,
          stitchType,
          createdAt: serverTimestamp()
        });
        showToast("¡Patrón guardado! 🎉");
        document.getElementById("pattern-name").value = "";
        document.getElementById("pattern-tags").value = "";
        loadPatterns();
      } catch (e) {
        showToast("Error al guardar 😕");
        console.error(e);
      }
    }

    // ── Load Patterns ────────────────────────────────────────────
    async function loadPatterns() {
      if (!currentUser) return;
      try {
        const q = query(
          collection(db, "patrones"),
          where("uid", "==", currentUser.uid)
        );
        const snap = await getDocs(q);
        userPatterns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPatterns();
      } catch (e) { console.error(e); }
    }

    function renderPatterns() {
      const grid = document.getElementById("patterns-grid");
      if (!grid) return;

      const searchTerm = (document.getElementById("patterns-search")?.value || "").trim().toLowerCase();
      const filtered = searchTerm
        ? userPatterns.filter(p =>
            p.name.toLowerCase().includes(searchTerm) ||
            (p.tags || []).some(t => t.includes(searchTerm))
          )
        : userPatterns;

      if (userPatterns.length === 0) {
        grid.innerHTML = `<p class="empty-msg">Aún no hay patrones guardados 🧵</p>`;
        return;
      }
      if (filtered.length === 0) {
        grid.innerHTML = `<p class="empty-msg">Sin resultados para "${searchTerm}" 🔍</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="pattern-card">
          <img src="${p.imageUrl}" alt="${p.name}" />
          <div class="pattern-info">
            <span class="pattern-name-label">${p.name}</span>
            ${(p.tags && p.tags.length) ? `<div class="pattern-tags">${p.tags.map(t => `<span class="tag-chip">${t}</span>`).join("")}</div>` : ""}
            <div class="pattern-actions">
              <button class="btn-load-pattern" data-id="${p.id}">Editar</button>
              <button class="btn-del-pattern" data-id="${p.id}">🗑</button>
            </div>
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".btn-load-pattern").forEach(btn => {
        btn.addEventListener("click", () => loadPatternToGrid(btn.dataset.id));
      });
      document.querySelectorAll(".btn-del-pattern").forEach(btn => {
        btn.addEventListener("click", () => deletePattern(btn.dataset.id));
      });
    }

    function loadPatternToGrid(id) {
      const p = userPatterns.find(x => x.id === id);
      if (!p) return;
      gridCols = p.cols;
      gridRows = p.rows;
      gridData = JSON.parse(p.gridData);
      stitchType = p.stitchType || "loom";
      document.getElementById("input-cols").value = gridCols;
      document.getElementById("input-rows").value = gridRows;
      document.querySelectorAll(".stitch-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.stitch === stitchType);
      });
      renderGrid();
      switchView("designer");
      showToast(`Patrón "${p.name}" cargado ✨`);
    }

    async function deletePattern(id) {
      if (!confirm("¿Eliminar este patrón?")) return;
      await deleteDoc(doc(db, "patrones", id));
      showToast("Patrón eliminado");
      loadPatterns();
    }

    // ── Beads Catalog ────────────────────────────────────────────
    async function loadBeads() {
      if (!currentUser) return;
      try {
        const q = query(collection(db, "cuentas"), where("uid", "==", currentUser.uid));
        const snap = await getDocs(q);
        userBeads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderBeads();
        renderPalette();
      } catch (e) { console.error(e); }
    }

    function renderBeads() {
      const list = document.getElementById("beads-list");
      if (!list) return;
      if (userBeads.length === 0) {
        list.innerHTML = `<p class="empty-msg">Agrega tus primeras cuentas 🪡</p>`;
        return;
      }
      list.innerHTML = userBeads.map(b => `
        <div class="bead-item">
          <div class="bead-color" style="background:${b.hex}"></div>
          <div class="bead-info">
            <span class="bead-code">${b.code || "—"}</span>
            <span class="bead-name">${b.name}</span>
          </div>
          <button class="btn-del-bead" data-id="${b.id}">✕</button>
        </div>
      `).join("");

      document.querySelectorAll(".btn-del-bead").forEach(btn => {
        btn.addEventListener("click", () => deleteBead(btn.dataset.id));
      });
    }

    async function addBead() {
      const code = document.getElementById("bead-code").value.trim();
      const name = document.getElementById("bead-name-input").value.trim();
      const hex  = document.getElementById("bead-hex").value;
      if (!name) { showToast("Ponle un nombre a la cuenta"); return; }
      await addDoc(collection(db, "cuentas"), {
        uid: currentUser.uid,
        code, name, hex,
        createdAt: serverTimestamp()
      });
      document.getElementById("bead-code").value = "";
      document.getElementById("bead-name-input").value = "";
      document.getElementById("bead-hex").value = "#C9A96E";
      showToast("Cuenta agregada ✨");
      loadBeads();
    }

    async function deleteBead(id) {
      await deleteDoc(doc(db, "cuentas", id));
      showToast("Cuenta eliminada");
      loadBeads();
    }

    // ── Perfil ───────────────────────────────────────────────────
    async function loadProfile() {
      if (!currentUser) return;
      try {
        const ref = doc(db, "usuarios", currentUser.uid);
        const snap = await getDoc(ref);
        if (snap.exists()) {
          const data = snap.data();
          userProfile.displayName = data.displayName || currentUser.displayName || "";
          userProfile.defaultCols = data.defaultCols || 10;
          userProfile.defaultRows = data.defaultRows || 10;
        } else {
          userProfile.displayName = currentUser.displayName || "";
        }
        // Solo aplicamos el tamaño por defecto una vez, al primer login,
        // para no pisar un patrón que la usuaria ya esté editando.
        if (!profileLoaded) {
          gridCols = userProfile.defaultCols;
          gridRows = userProfile.defaultRows;
          profileLoaded = true;
        }
      } catch (e) { console.error(e); }

      // Refrescar contadores del resumen (patrones y cuentas)
      await loadPatterns();

      renderProfile();
    }

    function renderProfile() {
      document.getElementById("profile-name-input").value = userProfile.displayName;
      document.getElementById("profile-email").textContent = currentUser.email || "";
      document.getElementById("stat-patterns").textContent = userPatterns.length;
      document.getElementById("stat-beads").textContent = userBeads.length;
      document.getElementById("profile-default-cols").value = userProfile.defaultCols;
      document.getElementById("profile-default-rows").value = userProfile.defaultRows;

      const usesPassword = currentUser.providerData.some(p => p.providerId === "password");
      document.getElementById("btn-change-password").style.display = usesPassword ? "flex" : "none";
    }

    async function saveProfile() {
      const name = document.getElementById("profile-name-input").value.trim();
      const cols = Math.min(40, Math.max(2, +document.getElementById("profile-default-cols").value || 10));
      const rows = Math.min(40, Math.max(2, +document.getElementById("profile-default-rows").value || 10));

      if (!name) { showToast("Ponle un nombre a tu perfil"); return; }

      try {
        await updateProfile(currentUser, { displayName: name });
        await setDoc(doc(db, "usuarios", currentUser.uid), {
          displayName: name,
          defaultCols: cols,
          defaultRows: rows
        }, { merge: true });

        userProfile = { displayName: name, defaultCols: cols, defaultRows: rows };
        document.getElementById("user-name").textContent = name;
        showToast("Perfil actualizado ✨");
      } catch (e) {
        showToast("Error al guardar perfil 😕");
        console.error(e);
      }
    }

    async function changePassword() {
      if (!currentUser?.email) return;
      try {
        await sendPasswordResetEmail(auth, currentUser.email);
        showToast(`Correo enviado a ${currentUser.email} 📧`);
      } catch (e) {
        showToast("Error al enviar correo 😕");
        console.error(e);
      }
    }

    // ── Auth ─────────────────────────────────────────────────────
    async function loginGoogle() {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (e) { showToast("Error con Google 😕"); }
    }

    async function loginEmail() {
      const email = document.getElementById("email-input").value.trim();
      const pass  = document.getElementById("pass-input").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        if (e.code === "auth/user-not-found" || e.code === "auth/invalid-credential") {
          try {
            await createUserWithEmailAndPassword(auth, email, pass);
          } catch (e2) { showToast("Error: " + e2.message); }
        } else { showToast("Error: " + e.message); }
      }
    }

    async function logout() {
      await signOut(auth);
    }

    // ── View Router ──────────────────────────────────────────────
    function switchView(view) {
      currentView = view;
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      const el = document.getElementById(`view-${view}`);
      if (el) el.classList.add("active");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      const nb = document.querySelector(`.nav-btn[data-view="${view}"]`);
      if (nb) nb.classList.add("active");

      if (view === "designer") { renderGrid(); renderPalette(); }
      if (view === "patterns") loadPatterns();
      if (view === "catalog")  loadBeads();
      if (view === "profile")  loadProfile();
    }

    // ── Toast ────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2800);
    }

    // ── Auth State ───────────────────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("view-login").classList.remove("active");
        document.getElementById("app-shell").style.display = "flex";
        document.getElementById("user-name").textContent = user.displayName || user.email;
        await loadProfile(); // aplica tamaño de cuadrícula por defecto antes de crearla
        document.getElementById("input-cols").value = gridCols;
        document.getElementById("input-rows").value = gridRows;
        switchView("designer");
        initGrid();
        loadBeads();
      } else {
        document.getElementById("app-shell").style.display = "none";
        document.getElementById("view-login").classList.add("active");
      }
    });

    // ── DOM Ready ────────────────────────────────────────────────
    window.addEventListener("DOMContentLoaded", () => {

      // Login
      document.getElementById("btn-google").addEventListener("click", loginGoogle);
      document.getElementById("btn-email-login").addEventListener("click", loginEmail);
      document.getElementById("btn-logout").addEventListener("click", logout);

      // Nav
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => switchView(btn.dataset.view));
      });

      // Grid controls
      document.getElementById("btn-apply-size").addEventListener("click", () => {
        gridCols = Math.min(40, Math.max(2, +document.getElementById("input-cols").value));
        gridRows = Math.min(40, Math.max(2, +document.getElementById("input-rows").value));
        initGrid();
      });

      document.getElementById("btn-clear").addEventListener("click", () => {
        initGrid();
        showToast("Cuadrícula limpiada 🧹");
      });

      document.getElementById("btn-erase").addEventListener("click", () => {
        paintMode = paintMode === "erase" ? "paint" : "erase";
        document.getElementById("btn-erase").classList.toggle("active", paintMode === "erase");
      });

      document.getElementById("btn-save-pattern").addEventListener("click", savePattern);

      // Stitch type toggle
      document.querySelectorAll(".stitch-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          stitchType = btn.dataset.stitch;
          document.querySelectorAll(".stitch-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderGrid();
        });
      });

      // Materials calculator
      document.getElementById("btn-materials").addEventListener("click", () => {
        const panel = document.getElementById("materials-panel");
        if (panel.classList.contains("show")) {
          panel.classList.remove("show");
        } else {
          closeOtherPanels("materials");
          calculateMaterials();
        }
      });

      // Undo
      document.getElementById("btn-undo").addEventListener("click", undo);
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          if (currentView === "designer") { e.preventDefault(); undo(); }
        }
      });

      // Modo Tejer
      document.getElementById("btn-weave").addEventListener("click", toggleWeavingMode);
      document.getElementById("btn-row-prev").addEventListener("click", () => stepRow(-1));
      document.getElementById("btn-row-next").addEventListener("click", () => stepRow(1));

      // Conteo por fila
      document.getElementById("btn-row-counts").addEventListener("click", toggleRowCounts);

      // Exportar / Imprimir
      document.getElementById("btn-export").addEventListener("click", exportPattern);

      // Buscador de patrones
      document.getElementById("patterns-search").addEventListener("input", renderPatterns);

      // Catalog
      document.getElementById("btn-add-bead").addEventListener("click", addBead);

      // Perfil
      document.getElementById("btn-save-profile").addEventListener("click", saveProfile);
      document.getElementById("btn-change-password").addEventListener("click", changePassword);

      // Color picker sync
      document.getElementById("color-picker").addEventListener("input", (e) => {
        selectedColor = e.target.value;
        paintMode = "paint";
        document.getElementById("btn-erase").classList.remove("active");
      });
    });
  </script>

    }
    .nav-btn .nav-icon { font-size: 1.4rem; line-height: 1; }
    .nav-btn.active { color: var(--gold); }
    .nav-btn:hover { color: var(--cream); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: calc(var(--nav-h) + 12px);
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      color: var(--cream);
      padding: 0.6rem 1.25rem;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid rgba(201,169,110,0.3);
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive: tablet ── */
    @media (min-width: 600px) {
      .app-nav { max-width: 480px; left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; }
      #app-shell { max-width: 480px; margin: 0 auto; }
      #patterns-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ── Responsive: escritorio (layout tipo panel) ──────────────
       Nav pasa a barra lateral izquierda, el contenido se despliega
       en dos columnas: cuadrícula grande + controles a la derecha.
       No toca HTML ni JS, solo reordena visualmente con CSS Grid. */
    @media (min-width: 960px) {
      #app-shell {
        max-width: none;
        margin: 0;
        height: 100dvh;
      }

      /* Nav lateral fija */
      .app-nav {
        position: fixed;
        left: 0; top: 0; bottom: 0; right: auto;
        transform: none;
        max-width: none;
        width: 96px;
        height: 100dvh;
        flex-direction: column;
        border-top: none;
        border-right: 1px solid var(--surface2);
        border-radius: 0;
        padding-bottom: 0;
        padding-top: 1rem;
        justify-content: flex-start;
        gap: 0.5rem;
      }
      .nav-btn { flex: none; padding: 0.9rem 0; font-size: 0.72rem; }
      .nav-btn .nav-icon { font-size: 1.6rem; }

      /* Columna principal desplazada por la nav lateral */
      .app-header, .app-content { margin-left: 96px; }

      .app-header {
        height: 64px;
        padding: 0 2rem;
      }
      .app-header h1 { font-size: 1.5rem; }

      .app-content {
        padding: 1.5rem 2rem 2rem;
        max-width: 1200px;
      }

      .view { padding: 0; }

      /* Panel del diseñador: cuadrícula grande a la izquierda,
         controles apilados en una columna fija a la derecha */
      #view-designer.active {
        display: grid;
        grid-template-columns: 1fr 340px;
        grid-template-rows: auto;
        gap: 0 2rem;
        align-items: start;
      }
      #view-designer.active > .grid-scroll {
        grid-column: 1;
        grid-row: 1 / -1;
        max-height: calc(100dvh - 64px - 3.5rem);
        order: 1;
      }
      #view-designer.active > *:not(.grid-scroll) {
        grid-column: 2;
      }
      .grid-cell { width: 28px; height: 28px; }

      /* Catálogo y patrones aprovechan el ancho */
      #view-catalog.active { max-width: 640px; }
      #patterns-grid { grid-template-columns: repeat(4, 1fr); gap: 1rem; }

      /* Toast se centra respecto al contenido, no a toda la pantalla */
      #toast { left: calc(50% + 48px); }
    }
  </style>
</head>
<body>

  <!-- ── LOGIN ── -->
  <div id="view-login">
    <div class="login-bg"></div>
    <div class="bead-grid-bg" id="bead-bg"></div>
    <div class="login-card">
      <div class="login-logo">
        <h1>Liro Miyuki</h1>
        <p>Tu estudio de tejido</p>
      </div>

      <button class="btn btn-google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Entrar con Google
      </button>

      <div class="divider">o con correo</div>

      <input class="input-field" id="email-input" type="email" placeholder="Correo electrónico" />
      <input class="input-field" id="pass-input" type="password" placeholder="Contraseña" />
      <button class="btn btn-primary" id="btn-email-login">Entrar / Registrarse</button>
    </div>
  </div>

  <!-- ── APP SHELL ── -->
  <div id="app-shell">

    <!-- Header -->
    <header class="app-header">
      <h1>Liro Miyuki</h1>
      <div class="header-user">
        <span id="user-name"></span>
        <button id="btn-logout">Salir</button>
      </div>
    </header>

    <!-- Content -->
    <main class="app-content">

      <!-- Designer -->
      <div class="view active" id="view-designer">
        <div class="designer-controls">
          <div class="size-inputs">
            <input type="number" id="input-cols" value="10" min="2" max="40" />
            <span>×</span>
            <input type="number" id="input-rows" value="10" min="2" max="40" />
            <button class="btn-sm btn-accent" id="btn-apply-size">OK</button>
          </div>
          <button class="btn-sm btn-secondary" id="btn-undo">↩️ Deshacer</button>
          <button class="btn-sm btn-secondary" id="btn-erase">✏️ Borrar</button>
          <button class="btn-sm btn-secondary" id="btn-clear">🧹 Limpiar</button>
        </div>

        <div class="designer-controls">
          <div class="stitch-toggle">
            <button class="stitch-btn active" data-stitch="loom">🪢 Telar</button>
            <button class="stitch-btn" data-stitch="peyote">🧶 Peyote</button>
          </div>
          <button class="btn-sm btn-secondary" id="btn-materials">📊 Materiales</button>
          <button class="btn-sm btn-secondary" id="btn-row-counts">📐 Por fila</button>
        </div>

        <div class="designer-controls">
          <button class="btn-sm btn-secondary" id="btn-weave">🧵 Tejer</button>
          <button class="btn-sm btn-secondary" id="btn-export">🖨️ Exportar</button>
        </div>

        <div class="weaving-panel" id="weaving-panel">
          <button class="btn-sm btn-accent" id="btn-row-prev">◀</button>
          <span id="weaving-row-label">Fila 1</span>
          <button class="btn-sm btn-accent" id="btn-row-next">▶</button>
        </div>

        <div class="materials-panel" id="materials-panel"></div>
        <div class="row-counts-panel" id="row-counts-panel"></div>

        <div class="palette-row">
          <div id="bead-palette"></div>
          <div class="color-picker-wrap">
            <input type="color" id="color-picker" value="#C9A96E" title="Color libre" />
          </div>
        </div>

        <div class="grid-scroll">
          <div id="grid-container"></div>
        </div>

        <div class="save-row">
          <input type="text" id="pattern-name" placeholder="Nombre del patrón…" />
          <button class="btn-sm btn-accent" id="btn-save-pattern">💾 Guardar</button>
        </div>
        <div class="save-row" style="margin-top: 0.5rem;">
          <input type="text" id="pattern-tags" placeholder="Etiquetas (pulsera, arete...) separadas por coma" />
        </div>
      </div>

      <!-- Catalog -->
      <div class="view" id="view-catalog">
        <p class="section-title">Mis Cuentas Miyuki</p>
        <div class="add-bead-form">
          <div class="form-row">
            <input type="text" id="bead-code" placeholder="Código (ej: DB-001)" />
            <input type="color" id="bead-hex" value="#C9A96E" />
          </div>
          <div class="form-row">
            <input type="text" id="bead-name-input" placeholder="Nombre del color" />
            <button class="btn-sm btn-accent" id="btn-add-bead">+ Agregar</button>
          </div>
        </div>
        <div id="beads-list"></div>
      </div>

      <!-- Patterns -->
      <div class="view" id="view-patterns">
        <p class="section-title">Mis Patrones</p>
        <input type="text" id="patterns-search" class="input-field" placeholder="Buscar por nombre o etiqueta…" style="margin-bottom: 0.75rem;" />
        <div id="patterns-grid"></div>
      </div>

      <!-- Profile -->
      <div class="view" id="view-profile">
        <p class="section-title">Perfil</p>

        <div class="profile-section">
          <p class="profile-label">Datos básicos</p>
          <input type="text" id="profile-name-input" class="input-field" placeholder="Tu nombre" />
          <p class="profile-email-row">📧 <span id="profile-email"></span></p>
        </div>

        <div class="profile-section">
          <p class="profile-label">Resumen</p>
          <div class="profile-stats">
            <div class="stat-box">
              <span class="stat-number" id="stat-patterns">0</span>
              <span class="stat-label">Patrones</span>
            </div>
            <div class="stat-box">
              <span class="stat-number" id="stat-beads">0</span>
              <span class="stat-label">Cuentas</span>
            </div>
          </div>
        </div>

        <div class="profile-section">
          <p class="profile-label">Preferencias — tamaño de cuadrícula por defecto</p>
          <div class="form-row">
            <input type="number" id="profile-default-cols" min="2" max="40" placeholder="Columnas" />
            <span style="color:var(--text-muted);">×</span>
            <input type="number" id="profile-default-rows" min="2" max="40" placeholder="Filas" />
          </div>
        </div>

        <button class="btn btn-primary" id="btn-save-profile" style="margin-bottom: 0.75rem;">Guardar cambios</button>
        <button class="btn btn-secondary" id="btn-change-password" style="display:none;">🔑 Cambiar contraseña</button>
      </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="app-nav">
      <button class="nav-btn active" data-view="designer">
        <span class="nav-icon">🎨</span>
        Diseñar
      </button>
      <button class="nav-btn" data-view="catalog">
        <span class="nav-icon">🪡</span>
        Cuentas
      </button>
      <button class="nav-btn" data-view="patterns">
        <span class="nav-icon">🗂️</span>
        Patrones
      </button>
      <button class="nav-btn" data-view="profile">
        <span class="nav-icon">👤</span>
        Perfil
      </button>
    </nav>

  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Bead grid background animation -->
  <script>
    const bg = document.getElementById("bead-bg");
    const colors = ["#C9A96E","#8B6B8B","#7EC8C8","#D4A5A5","#A8D8A8","#4A4A6A","#E8D5C4"];
    for (let i = 0; i < 160; i++) {
      const d = document.createElement("div");
      d.className = "bead-dot";
      d.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      d.style.setProperty("--d", (2 + Math.random() * 3) + "s");
      d.style.setProperty("--delay", (Math.random() * 3) + "s");
      bg.appendChild(d);
    }
  </script>

</body>
</html>
