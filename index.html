<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liro Miyuki v1.1</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      query,
      where,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ── Firebase Config ──────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyDl1C_xN_QxgSu49SKPBB1O3nke_7Ej-Lo",
      authDomain: "liro-miyuky.firebaseapp.com",
      projectId: "liro-miyuky",
      storageBucket: "liro-miyuky.firebasestorage.app",
      messagingSenderId: "774423148301",
      appId: "1:774423148301:web:17c5f11bec3e4f40d26244"
    };

    // ── Cloudinary Config ────────────────────────────────────────
    const CLOUDINARY_CLOUD = "dv7lelmoy";
    const CLOUDINARY_PRESET = "liro-miyuki";
    const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // ── State ────────────────────────────────────────────────────
    let currentUser = null;
    let currentView = "login";
    let gridCols = 10;
    let gridRows = 10;
    let gridData = [];
    let stitchType = "loom"; // loom | peyote
    let selectedColor = "#C9A96E";
    let isPainting = false;
    let paintMode = "paint"; // paint | erase
    let userBeads = [];
    let userPatterns = [];

    // ── Init Grid ────────────────────────────────────────────────
    function initGrid() {
      gridData = Array.from({ length: gridRows }, () =>
        Array(gridCols).fill("#F0EBE3")
      );
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById("grid-container");
      if (!container) return;

      // Modo telar: cuadrícula recta con CSS grid (comportamiento original)
      // Modo peyote: filas en flex, con offset en filas impares (el desfase real del tejido)
      container.classList.toggle("mode-peyote", stitchType === "peyote");
      container.style.gridTemplateColumns = stitchType === "loom" ? `repeat(${gridCols}, 1fr)` : "";
      container.style.display = stitchType === "loom" ? "grid" : "flex";
      container.style.flexDirection = stitchType === "loom" ? "" : "column";
      container.innerHTML = "";

      const paintCell = (r, c, cellEl) => {
        const newColor = paintMode === "erase" ? "#F0EBE3" : selectedColor;
        gridData[r][c] = newColor;
        cellEl.style.backgroundColor = newColor;
      };

      const buildCell = (r, c, color) => {
        const cell = document.createElement("div");
        cell.className = "grid-cell";
        cell.style.backgroundColor = color;
        cell.dataset.r = r;
        cell.dataset.c = c;

        cell.addEventListener("mousedown", () => { isPainting = true; paintCell(r, c, cell); });
        cell.addEventListener("mouseover", () => { if (isPainting) paintCell(r, c, cell); });
        cell.addEventListener("touchstart", (e) => { e.preventDefault(); isPainting = true; paintCell(r, c, cell); }, { passive: false });
        cell.addEventListener("touchmove", (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          if (el && el.classList.contains("grid-cell")) {
            const tr = +el.dataset.r, tc = +el.dataset.c;
            paintCell(tr, tc, el);
          }
        }, { passive: false });

        return cell;
      };

      if (stitchType === "loom") {
        gridData.forEach((row, r) => {
          row.forEach((color, c) => {
            container.appendChild(buildCell(r, c, color));
          });
        });
      } else {
        // Peyote/brick: cada fila es un contenedor flex; filas impares llevan
        // un margen de medio-celda para simular el desfase del tejido real
        gridData.forEach((row, r) => {
          const rowEl = document.createElement("div");
          rowEl.className = "peyote-row";
          if (r % 2 === 1) rowEl.classList.add("offset");
          row.forEach((color, c) => {
            rowEl.appendChild(buildCell(r, c, color));
          });
          container.appendChild(rowEl);
        });
      }

      document.addEventListener("mouseup", () => { isPainting = false; });
    }

    // ── Render Palette ───────────────────────────────────────────
    function renderPalette() {
      const palette = document.getElementById("bead-palette");
      if (!palette) return;
      palette.innerHTML = "";

      const defaults = ["#C9A96E","#8B6B8B","#1A1A2E","#E8D5C4","#F0EBE3",
                        "#D4A5A5","#7EC8C8","#A8D8A8","#F4C97E","#4A4A6A"];

      const allColors = [...new Set([...defaults, ...userBeads.map(b => b.hex)])];

      allColors.forEach(hex => {
        const swatch = document.createElement("button");
        swatch.className = "swatch";
        swatch.style.backgroundColor = hex;
        if (hex === selectedColor) swatch.classList.add("active");
        swatch.title = hex;
        swatch.addEventListener("click", () => {
          selectedColor = hex;
          paintMode = "paint";
          document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
          swatch.classList.add("active");
          document.getElementById("btn-erase").classList.remove("active");
        });
        palette.appendChild(swatch);
      });
    }

    // ── Capture Grid as Image ────────────────────────────────────
    function captureGridImage() {
      return new Promise((resolve) => {
        const cellSize = 20;
        const canvas = document.createElement("canvas");
        canvas.width = gridCols * cellSize;
        canvas.height = gridRows * cellSize;
        const ctx = canvas.getContext("2d");
        gridData.forEach((row, r) => {
          row.forEach((color, c) => {
            ctx.fillStyle = color;
            ctx.fillRect(c * cellSize, r * cellSize, cellSize - 1, cellSize - 1);
          });
        });
        canvas.toBlob(resolve, "image/png");
      });
    }

    // ── Materials Calculator ─────────────────────────────────────
    // Estimado: cuenta Miyuki 11/0 ≈ 20 cuentas por gramo (aproximado,
    // varía según lote/forma). Se usa solo como referencia.
    const BEADS_PER_GRAM = 20;

    function calculateMaterials() {
      const counts = {};
      gridData.forEach(row => {
        row.forEach(color => {
          if (color === "#F0EBE3") return; // celda vacía, no cuenta
          counts[color] = (counts[color] || 0) + 1;
        });
      });

      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const totalBeads = entries.reduce((sum, [, n]) => sum + n, 0);
      const totalGrams = (totalBeads / BEADS_PER_GRAM).toFixed(1);

      const panel = document.getElementById("materials-panel");
      if (entries.length === 0) {
        panel.innerHTML = `<p class="empty-msg">Pinta algo en la cuadrícula primero 🎨</p>`;
        panel.classList.add("show");
        return;
      }

      const findBeadLabel = (hex) => {
        const match = userBeads.find(b => b.hex.toLowerCase() === hex.toLowerCase());
        return match ? `${match.code ? match.code + " · " : ""}${match.name}` : null;
      };

      panel.innerHTML = `
        <div class="materials-summary">
          <strong>${totalBeads}</strong> cuentas · <strong>~${totalGrams} g</strong> aprox.
        </div>
        <div class="materials-list">
          ${entries.map(([hex, count]) => {
            const label = findBeadLabel(hex);
            const grams = (count / BEADS_PER_GRAM).toFixed(1);
            return `
              <div class="material-item">
                <div class="bead-color" style="background:${hex}"></div>
                <div class="bead-info">
                  <span class="bead-name">${label || hex}</span>
                  <span class="bead-code">${count} cuentas · ~${grams} g</span>
                </div>
              </div>
            `;
          }).join("")}
        </div>
        <p class="materials-note">* Estimado con ${BEADS_PER_GRAM} cuentas/gramo (Miyuki 11/0). Puede variar según el lote.</p>
      `;
      panel.classList.add("show");
    }


    async function uploadToCloudinary(blob) {
      const formData = new FormData();
      formData.append("file", blob);
      formData.append("upload_preset", CLOUDINARY_PRESET);
      const res = await fetch(CLOUDINARY_UPLOAD_URL, { method: "POST", body: formData });
      const data = await res.json();
      return data.secure_url;
    }

    // ── Save Pattern ─────────────────────────────────────────────
    async function savePattern() {
      const name = document.getElementById("pattern-name").value.trim();
      if (!name) { showToast("Ponle un nombre al patrón ✏️"); return; }
      if (!currentUser) return;

      showToast("Guardando patrón...");
      try {
        const blob = await captureGridImage();
        const imageUrl = await uploadToCloudinary(blob);
        await addDoc(collection(db, "patrones"), {
          uid: currentUser.uid,
          name,
          imageUrl,
          gridData: JSON.stringify(gridData),
          cols: gridCols,
          rows: gridRows,
          stitchType,
          createdAt: serverTimestamp()
        });
        showToast("¡Patrón guardado! 🎉");
        document.getElementById("pattern-name").value = "";
        loadPatterns();
      } catch (e) {
        showToast("Error al guardar 😕");
        console.error(e);
      }
    }

    // ── Load Patterns ────────────────────────────────────────────
    async function loadPatterns() {
      if (!currentUser) return;
      try {
        const q = query(
          collection(db, "patrones"),
          where("uid", "==", currentUser.uid)
        );
        const snap = await getDocs(q);
        userPatterns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPatterns();
      } catch (e) { console.error(e); }
    }

    function renderPatterns() {
      const grid = document.getElementById("patterns-grid");
      if (!grid) return;
      if (userPatterns.length === 0) {
        grid.innerHTML = `<p class="empty-msg">Aún no hay patrones guardados 🧵</p>`;
        return;
      }
      grid.innerHTML = userPatterns.map(p => `
        <div class="pattern-card">
          <img src="${p.imageUrl}" alt="${p.name}" />
          <div class="pattern-info">
            <span class="pattern-name-label">${p.name}</span>
            <div class="pattern-actions">
              <button class="btn-load-pattern" data-id="${p.id}">Editar</button>
              <button class="btn-del-pattern" data-id="${p.id}">🗑</button>
            </div>
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".btn-load-pattern").forEach(btn => {
        btn.addEventListener("click", () => loadPatternToGrid(btn.dataset.id));
      });
      document.querySelectorAll(".btn-del-pattern").forEach(btn => {
        btn.addEventListener("click", () => deletePattern(btn.dataset.id));
      });
    }

    function loadPatternToGrid(id) {
      const p = userPatterns.find(x => x.id === id);
      if (!p) return;
      gridCols = p.cols;
      gridRows = p.rows;
      gridData = JSON.parse(p.gridData);
      stitchType = p.stitchType || "loom";
      document.getElementById("input-cols").value = gridCols;
      document.getElementById("input-rows").value = gridRows;
      document.querySelectorAll(".stitch-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.stitch === stitchType);
      });
      renderGrid();
      switchView("designer");
      showToast(`Patrón "${p.name}" cargado ✨`);
    }

    async function deletePattern(id) {
      if (!confirm("¿Eliminar este patrón?")) return;
      await deleteDoc(doc(db, "patrones", id));
      showToast("Patrón eliminado");
      loadPatterns();
    }

    // ── Beads Catalog ────────────────────────────────────────────
    async function loadBeads() {
      if (!currentUser) return;
      try {
        const q = query(collection(db, "cuentas"), where("uid", "==", currentUser.uid));
        const snap = await getDocs(q);
        userBeads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderBeads();
        renderPalette();
      } catch (e) { console.error(e); }
    }

    function renderBeads() {
      const list = document.getElementById("beads-list");
      if (!list) return;
      if (userBeads.length === 0) {
        list.innerHTML = `<p class="empty-msg">Agrega tus primeras cuentas 🪡</p>`;
        return;
      }
      list.innerHTML = userBeads.map(b => `
        <div class="bead-item">
          <div class="bead-color" style="background:${b.hex}"></div>
          <div class="bead-info">
            <span class="bead-code">${b.code || "—"}</span>
            <span class="bead-name">${b.name}</span>
          </div>
          <button class="btn-del-bead" data-id="${b.id}">✕</button>
        </div>
      `).join("");

      document.querySelectorAll(".btn-del-bead").forEach(btn => {
        btn.addEventListener("click", () => deleteBead(btn.dataset.id));
      });
    }

    async function addBead() {
      const code = document.getElementById("bead-code").value.trim();
      const name = document.getElementById("bead-name-input").value.trim();
      const hex  = document.getElementById("bead-hex").value;
      if (!name) { showToast("Ponle un nombre a la cuenta"); return; }
      await addDoc(collection(db, "cuentas"), {
        uid: currentUser.uid,
        code, name, hex,
        createdAt: serverTimestamp()
      });
      document.getElementById("bead-code").value = "";
      document.getElementById("bead-name-input").value = "";
      document.getElementById("bead-hex").value = "#C9A96E";
      showToast("Cuenta agregada ✨");
      loadBeads();
    }

    async function deleteBead(id) {
      await deleteDoc(doc(db, "cuentas", id));
      showToast("Cuenta eliminada");
      loadBeads();
    }

    // ── Auth ─────────────────────────────────────────────────────
    async function loginGoogle() {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (e) { showToast("Error con Google 😕"); }
    }

    async function loginEmail() {
      const email = document.getElementById("email-input").value.trim();
      const pass  = document.getElementById("pass-input").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        if (e.code === "auth/user-not-found" || e.code === "auth/invalid-credential") {
          try {
            await createUserWithEmailAndPassword(auth, email, pass);
          } catch (e2) { showToast("Error: " + e2.message); }
        } else { showToast("Error: " + e.message); }
      }
    }

    async function logout() {
      await signOut(auth);
    }

    // ── View Router ──────────────────────────────────────────────
    function switchView(view) {
      currentView = view;
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      const el = document.getElementById(`view-${view}`);
      if (el) el.classList.add("active");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      const nb = document.querySelector(`.nav-btn[data-view="${view}"]`);
      if (nb) nb.classList.add("active");

      if (view === "designer") { renderGrid(); renderPalette(); }
      if (view === "patterns") loadPatterns();
      if (view === "catalog")  loadBeads();
    }

    // ── Toast ────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2800);
    }

    // ── Auth State ───────────────────────────────────────────────
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("view-login").classList.remove("active");
        document.getElementById("app-shell").style.display = "flex";
        document.getElementById("user-name").textContent = user.displayName || user.email;
        switchView("designer");
        initGrid();
        loadBeads();
      } else {
        document.getElementById("app-shell").style.display = "none";
        document.getElementById("view-login").classList.add("active");
      }
    });

    // ── DOM Ready ────────────────────────────────────────────────
    window.addEventListener("DOMContentLoaded", () => {

      // Login
      document.getElementById("btn-google").addEventListener("click", loginGoogle);
      document.getElementById("btn-email-login").addEventListener("click", loginEmail);
      document.getElementById("btn-logout").addEventListener("click", logout);

      // Nav
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => switchView(btn.dataset.view));
      });

      // Grid controls
      document.getElementById("btn-apply-size").addEventListener("click", () => {
        gridCols = Math.min(40, Math.max(2, +document.getElementById("input-cols").value));
        gridRows = Math.min(40, Math.max(2, +document.getElementById("input-rows").value));
        initGrid();
      });

      document.getElementById("btn-clear").addEventListener("click", () => {
        initGrid();
        showToast("Cuadrícula limpiada 🧹");
      });

      document.getElementById("btn-erase").addEventListener("click", () => {
        paintMode = paintMode === "erase" ? "paint" : "erase";
        document.getElementById("btn-erase").classList.toggle("active", paintMode === "erase");
      });

      document.getElementById("btn-save-pattern").addEventListener("click", savePattern);

      // Stitch type toggle
      document.querySelectorAll(".stitch-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          stitchType = btn.dataset.stitch;
          document.querySelectorAll(".stitch-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderGrid();
        });
      });

      // Materials calculator
      document.getElementById("btn-materials").addEventListener("click", () => {
        const panel = document.getElementById("materials-panel");
        if (panel.classList.contains("show")) {
          panel.classList.remove("show");
        } else {
          calculateMaterials();
        }
      });

      // Catalog
      document.getElementById("btn-add-bead").addEventListener("click", addBead);

      // Color picker sync
      document.getElementById("color-picker").addEventListener("input", (e) => {
        selectedColor = e.target.value;
        paintMode = "paint";
        document.getElementById("btn-erase").classList.remove("active");
      });
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1A1A2E;
      --surface: #2D2D44;
      --surface2: #3A3A55;
      --cream: #E8D5C4;
      --gold: #C9A96E;
      --mauve: #8B6B8B;
      --white: #F0EBE3;
      --text: #E8D5C4;
      --text-muted: #9A8FA0;
      --radius: 12px;
      --radius-sm: 8px;
      --nav-h: 68px;
      --header-h: 56px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    /* ── Login ── */
    #view-login {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    #view-login.active { display: flex; }

    .login-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 20%, #3A2A4A 0%, #1A1A2E 60%);
      z-index: 0;
    }

    /* Animated bead grid background */
    .bead-grid-bg {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 4px;
      padding: 4px;
      z-index: 1;
      opacity: 0.15;
    }
    .bead-dot {
      border-radius: 50%;
      aspect-ratio: 1;
      animation: shimmer var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    .login-card {
      position: relative; z-index: 2;
      width: 100%; max-width: 360px;
      background: rgba(45, 45, 68, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(201, 169, 110, 0.2);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .login-logo {
      text-align: center;
    }
    .login-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: 0.02em;
    }
    .login-logo p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .divider {
      display: flex; align-items: center; gap: 0.75rem;
      color: var(--text-muted); font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1;
      height: 1px; background: var(--surface2);
    }

    .input-field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--gold); }
    .input-field::placeholder { color: var(--text-muted); }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #B8935A);
      color: #1A1A2E;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-google {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-google:hover { background: var(--surface); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
    }
    .btn-secondary:hover { background: var(--mauve); }
    .btn-secondary.active { background: var(--mauve); }

    .btn-sm {
      padding: 0.4rem 0.75rem;
      font-size: 0.78rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }
    .btn-accent { background: var(--gold); color: #1A1A2E; }
    .btn-danger { background: #7A3030; color: var(--cream); }

    /* ── App Shell ── */
    #app-shell {
      display: none;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Header */
    .app-header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--surface2);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem;
      flex-shrink: 0;
    }
    .app-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--gold);
    }
    .header-user {
      display: flex; align-items: center; gap: 0.5rem;
    }
    #user-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      max-width: 120px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #btn-logout {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 0.75rem; padding: 0.25rem 0.5rem;
      border-radius: 6px;
      transition: color 0.2s;
    }
    #btn-logout:hover { color: var(--cream); }

    /* Content area */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: calc(var(--nav-h) + 0.5rem);
    }

    /* Views */
    .view { display: none; padding: 1rem; }
    .view.active { display: block; }

    /* ── Designer ── */
    .designer-controls {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      align-items: center; margin-bottom: 0.75rem;
    }
    .size-inputs {
      display: flex; align-items: center; gap: 0.4rem;
    }
    .size-inputs input {
      width: 52px;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.4rem 0.5rem;
      text-align: center;
      outline: none;
    }
    .size-inputs span { color: var(--text-muted); font-size: 0.8rem; }

    .palette-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 0.75rem; align-items: center;
    }
    .swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: var(--white); transform: scale(1.2); }

    .color-picker-wrap {
      display: flex; align-items: center; gap: 0.4rem;
    }
    #color-picker {
      width: 32px; height: 32px;
      border: none; border-radius: 50%;
      cursor: pointer; padding: 0;
      background: none;
    }

    .grid-scroll {
      overflow: auto;
      border: 1px solid var(--surface2);
      border-radius: var(--radius);
      background: #F0EBE3;
      margin-bottom: 0.75rem;
      max-height: 52vh;
      touch-action: none;
    }
    #grid-container {
      display: grid;
      gap: 1px;
      padding: 4px;
      background: #D0C5BC;
      min-width: fit-content;
    }
    #grid-container.mode-peyote {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .peyote-row {
      display: flex;
      gap: 1px;
    }
    .peyote-row.offset {
      margin-left: 12px; /* medio ancho de celda (24px/2), simula el desfase real */
    }
    .grid-cell {
      width: 24px; height: 24px;
      border-radius: 3px;
      cursor: crosshair;
      transition: transform 0.05s;
      flex-shrink: 0;
    }
    .grid-cell:hover { transform: scale(1.08); z-index: 1; position: relative; }

    .stitch-toggle {
      display: flex;
      background: var(--surface);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .stitch-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-family: 'Inter', sans-serif;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .stitch-btn.active {
      background: var(--gold);
      color: #1A1A2E;
      font-weight: 500;
    }

    .materials-panel {
      display: none;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .materials-panel.show { display: block; }
    .materials-summary {
      font-size: 0.95rem;
      color: var(--cream);
      padding-bottom: 0.75rem;
      margin-bottom: 0.6rem;
      border-bottom: 1px solid var(--surface2);
    }
    .materials-list {
      display: flex; flex-direction: column; gap: 0.5rem;
      max-height: 240px;
      overflow-y: auto;
    }
    .material-item {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .materials-note {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
      font-style: italic;
    }

    .save-row {
      display: flex; gap: 0.5rem; align-items: center;
    }
    .save-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.6rem 0.75rem;
      outline: none;
    }
    .save-row input:focus { border-color: var(--gold); }
    .save-row input::placeholder { color: var(--text-muted); }

    /* ── Catalog ── */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .add-bead-form {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex; flex-direction: column; gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .form-row { display: flex; gap: 0.5rem; align-items: center; }
    .form-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.55rem 0.75rem;
      outline: none;
    }
    .form-row input:focus { border-color: var(--gold); }
    .form-row input::placeholder { color: var(--text-muted); }

    #bead-hex {
      width: 40px; height: 36px;
      border: none; border-radius: 8px;
      cursor: pointer; padding: 0;
      background: none; flex-shrink: 0;
    }

    #beads-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .bead-item {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.75rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .bead-color {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .bead-info { flex: 1; }
    .bead-code {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--gold);
    }
    .bead-name { font-size: 0.85rem; }
    .btn-del-bead {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 0.9rem; padding: 0.25rem;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .btn-del-bead:hover { color: #D97070; }

    /* ── Patterns ── */
    #patterns-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .pattern-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .pattern-card img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover;
      image-rendering: pixelated;
      display: block;
    }
    .pattern-info {
      padding: 0.6rem 0.75rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pattern-name-label { font-size: 0.82rem; color: var(--cream); }
    .pattern-actions { display: flex; gap: 0.4rem; }

    .empty-msg {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 2rem 1rem;
      grid-column: 1/-1;
    }

    /* ── Bottom Nav ── */
    .app-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1;
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.25rem;
      font-size: 0.65rem;
      font-family: 'Inter', sans-serif;
      transition: color 0.2s;
      padding: 0.5rem 0;
    }
    .nav-btn .nav-icon { font-size: 1.4rem; line-height: 1; }
    .nav-btn.active { color: var(--gold); }
    .nav-btn:hover { color: var(--cream); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: calc(var(--nav-h) + 12px);
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      color: var(--cream);
      padding: 0.6rem 1.25rem;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid rgba(201,169,110,0.3);
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ── */
    @media (min-width: 600px) {
      .app-nav { max-width: 480px; left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; }
      #app-shell { max-width: 480px; margin: 0 auto; }
      #patterns-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <!-- ── LOGIN ── -->
  <div id="view-login">
    <div class="login-bg"></div>
    <div class="bead-grid-bg" id="bead-bg"></div>
    <div class="login-card">
      <div class="login-logo">
        <h1>Liro Miyuki</h1>
        <p>Tu estudio de tejido</p>
      </div>

      <button class="btn btn-google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Entrar con Google
      </button>

      <div class="divider">o con correo</div>

      <input class="input-field" id="email-input" type="email" placeholder="Correo electrónico" />
      <input class="input-field" id="pass-input" type="password" placeholder="Contraseña" />
      <button class="btn btn-primary" id="btn-email-login">Entrar / Registrarse</button>
    </div>
  </div>

  <!-- ── APP SHELL ── -->
  <div id="app-shell">

    <!-- Header -->
    <header class="app-header">
      <h1>Liro Miyuki</h1>
      <div class="header-user">
        <span id="user-name"></span>
        <button id="btn-logout">Salir</button>
      </div>
    </header>

    <!-- Content -->
    <main class="app-content">

      <!-- Designer -->
      <div class="view active" id="view-designer">
        <div class="designer-controls">
          <div class="size-inputs">
            <input type="number" id="input-cols" value="10" min="2" max="40" />
            <span>×</span>
            <input type="number" id="input-rows" value="10" min="2" max="40" />
            <button class="btn-sm btn-accent" id="btn-apply-size">OK</button>
          </div>
          <button class="btn-sm btn-secondary" id="btn-erase">✏️ Borrar</button>
          <button class="btn-sm btn-secondary" id="btn-clear">🧹 Limpiar</button>
        </div>

        <div class="designer-controls">
          <div class="stitch-toggle">
            <button class="stitch-btn active" data-stitch="loom">🪢 Telar</button>
            <button class="stitch-btn" data-stitch="peyote">🧶 Peyote</button>
          </div>
          <button class="btn-sm btn-secondary" id="btn-materials">📊 Materiales</button>
        </div>

        <div class="materials-panel" id="materials-panel"></div>

        <div class="palette-row">
          <div id="bead-palette"></div>
          <div class="color-picker-wrap">
            <input type="color" id="color-picker" value="#C9A96E" title="Color libre" />
          </div>
        </div>

        <div class="grid-scroll">
          <div id="grid-container"></div>
        </div>

        <div class="save-row">
          <input type="text" id="pattern-name" placeholder="Nombre del patrón…" />
          <button class="btn-sm btn-accent" id="btn-save-pattern">💾 Guardar</button>
        </div>
      </div>

      <!-- Catalog -->
      <div class="view" id="view-catalog">
        <p class="section-title">Mis Cuentas Miyuki</p>
        <div class="add-bead-form">
          <div class="form-row">
            <input type="text" id="bead-code" placeholder="Código (ej: DB-001)" />
            <input type="color" id="bead-hex" value="#C9A96E" />
          </div>
          <div class="form-row">
            <input type="text" id="bead-name-input" placeholder="Nombre del color" />
            <button class="btn-sm btn-accent" id="btn-add-bead">+ Agregar</button>
          </div>
        </div>
        <div id="beads-list"></div>
      </div>

      <!-- Patterns -->
      <div class="view" id="view-patterns">
        <p class="section-title">Mis Patrones</p>
        <div id="patterns-grid"></div>
      </div>

      <!-- Profile -->
      <div class="view" id="view-profile">
        <p class="section-title">Perfil</p>
        <p style="color:var(--text-muted); font-size:0.85rem;">Próximamente más opciones aquí 🌸</p>
      </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="app-nav">
      <button class="nav-btn active" data-view="designer">
        <span class="nav-icon">🎨</span>
        Diseñar
      </button>
      <button class="nav-btn" data-view="catalog">
        <span class="nav-icon">🪡</span>
        Cuentas
      </button>
      <button class="nav-btn" data-view="patterns">
        <span class="nav-icon">🗂️</span>
        Patrones
      </button>
      <button class="nav-btn" data-view="profile">
        <span class="nav-icon">👤</span>
        Perfil
      </button>
    </nav>

  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Bead grid background animation -->
  <script>
    const bg = document.getElementById("bead-bg");
    const colors = ["#C9A96E","#8B6B8B","#7EC8C8","#D4A5A5","#A8D8A8","#4A4A6A","#E8D5C4"];
    for (let i = 0; i < 160; i++) {
      const d = document.createElement("div");
      d.className = "bead-dot";
      d.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      d.style.setProperty("--d", (2 + Math.random() * 3) + "s");
      d.style.setProperty("--delay", (Math.random() * 3) + "s");
      bg.appendChild(d);
    }
  </script>

</body>
</html>
